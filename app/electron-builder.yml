appId: io.github.jeongho30.lecture-notes
productName: Note-crAIte
directories:
  output: ../dist/installer
files:
  - out/**
# whisper·ffmpeg 실행 파일은 asar 밖에 둔다 (실행해야 하므로). 앱에서는 resources/bin/...으로 찾는다.
# 빌드 전에 scripts/build_whisper.ps1과 scripts/fetch_ffmpeg.ps1을 돌려 둔다 (macOS는 build_whisper.sh와 build_ffmpeg.sh).
extraResources:
  - from: ../.cache/whisper/bin
    to: bin/whisper
  # ffmpeg.exe(LGPL 빌드)와 라이선스·소스 안내
  - from: ../.cache/ffmpeg/bin
    to: bin
  - from: resources/probe-ko.wav
    to: probe-ko.wav
  # 설정 > 고급의 [샘플로 시험하기]가 전사를 대본과 비교한다
  - from: resources/probe-ko.txt
    to: probe-ko.txt
  # 창과 트레이가 쓰는 아이콘
  - from: resources/icon.ico
    to: icon.ico
  # macOS 메뉴 막대 아이콘 (Windows는 icon.ico를 쓴다)
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
  # 글꼴 파일은 renderer 번들(asar)에 들어가고, OFL은 라이선스를 함께 배포하게 한다.
  - from: src/renderer/src/assets/fonts/LICENSE-Pretendard.txt
    to: LICENSE-Pretendard.txt
  # 오픈소스 고지 (scripts/notices.mjs가 만든다). 설정 > 정보에서 연다
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
npmRebuild: false
# Chromium 언어 파일(우클릭 메뉴 등 Chromium이 그리는 글자)은 이 언어만 넣는다. en-US는 맞는 언어가 없을 때의 기본값이라 빼지 않는다.
electronLanguages:
  - ko
  - en-US
  - zh-CN
  - zh-TW
  - ja
win:
  target: nsis
  icon: resources/icon.ico
mac:
  # Apple Silicon만 만든다 (whisper는 Metal로 돌고, Intel Mac은 빌드·확인할 곳이 없다)
  target:
    - target: dmg
      arch: arm64
  icon: resources/icon.icns
  category: public.app-category.education
  # Apple 개발자 인증서가 없어 임시(ad-hoc) 서명만 한다. Apple Silicon은 서명이 아예 없으면 "손상됨"으로 열리지 않는다.
  # 받은 사람은 처음 열 때 시스템 설정 > 개인정보 보호 및 보안에서 [그래도 열기]를 눌러야 한다.
  # 인증서가 생기면 identity를 지우고 hardenedRuntime을 켠 뒤 마이크 권한(com.apple.security.device.audio-input)을 넣고 공증한다.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    # 없으면 앱에서 녹음을 시작할 때 macOS가 앱을 끝낸다
    NSMicrophoneUsageDescription: 강의를 녹음하려면 마이크를 써야 해요.
nsis:
  oneClick: true
  perMachine: false
  # 바탕화면 바로가기는 첫 실행 마법사에서 고르면 앱이 만든다. 제거할 때는 installer.nsh가 지운다
  createDesktopShortcut: false
  include: installer.nsh
