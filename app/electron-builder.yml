appId: io.github.jeongho30.lecture-notes
productName: Note-crAIte
directories:
  output: ../dist/installer
files:
  - out/**
# whisper·ffmpeg 실행 파일은 asar 밖에 둔다 (실행해야 하므로). 앱에서는 resources/bin/...으로 찾는다.
# 빌드 전에 scripts/build_whisper.ps1과 scripts/fetch_ffmpeg.ps1을 돌려 둔다.
extraResources:
  - from: ../.cache/whisper/bin
    to: bin/whisper
  # ffmpeg.exe(LGPL 빌드)와 라이선스·소스 안내
  - from: ../.cache/ffmpeg/bin
    to: bin
  - from: resources/probe-ko.wav
    to: probe-ko.wav
  # 설정 > 고급의 [샘플로 시험하기]가 전사를 대본과 비교한다
  - from: resources/probe-ko.txt
    to: probe-ko.txt
  # 글꼴 파일은 renderer 번들(asar)에 들어가고, OFL은 라이선스를 함께 배포하게 한다.
  - from: src/renderer/src/assets/fonts/LICENSE-Pretendard.txt
    to: LICENSE-Pretendard.txt
  # 오픈소스 고지 (scripts/notices.mjs가 만든다). 설정 > 정보에서 연다
  - from: build/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
npmRebuild: false
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
