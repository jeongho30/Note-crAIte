appId: io.github.jeongho30.lecture-notes
productName: lecture-notes
directories:
  output: ../dist/installer
files:
  - out/**
# whisper(와 이후 ffmpeg) 실행 파일은 asar 밖에 둔다 (실행해야 하므로). 앱에서는 resources/bin/...으로 찾는다.
extraResources:
  - from: ../.cache/whisper/bin
    to: bin/whisper
  - from: resources/probe-ko.wav
    to: probe-ko.wav
npmRebuild: false
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
