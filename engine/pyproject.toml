[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lnengine"
version = "0.1.0"
description = "강의 녹음을 마크다운 노트로 만드는 엔진"
requires-python = ">=3.13"
dependencies = ["requests", "pyyaml", "psutil"]

[project.optional-dependencies]
dev = ["pytest"]
bench = ["faster-whisper", "rapidfuzz"]
build = ["pyinstaller"]

[project.scripts]
lnengine = "lnengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lnengine = ["data/*.json", "data/*.txt", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
