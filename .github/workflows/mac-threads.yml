# 임시: macOS 러너에서 whisper-cli가 스레드 1개일 때 왜 수십 배 느린지 재 본다 (스레드 수와 VAD를 바꿔 가며). 확인하면 지운다.
name: mac-threads

on:
  push:
    branches: [feat/mac]
    paths: ['.github/workflows/mac-threads.yml']

permissions:
  contents: read

jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: whisper.cpp 캐시
        id: whisper-cache
        uses: actions/cache@v6
        with:
          path: .cache/whisper/bin
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_whisper.sh') }}

      - name: whisper.cpp 빌드
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_whisper.sh

      - name: 받아쓰기 모델 캐시
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ln-data/models
          key: models-small-q5_1-${{ hashFiles('app/src/core/models.ts') }}

      - name: 재기
        working-directory: app
        run: |
          npm ci > /dev/null
          npm run --silent cli -- --data-dir "$RUNNER_TEMP/ln-data" models download small-q5_1 silero-v6.2.0 > /dev/null
          sysctl -n machdep.cpu.brand_string hw.physicalcpu
          W="$GITHUB_WORKSPACE/.cache/whisper/bin/whisper-cli"
          M="$RUNNER_TEMP/ln-data/models"
          cp resources/probe-ko.wav "$RUNNER_TEMP/s.wav"
          cd "$RUNNER_TEMP"
          run() {
            local s; s=$(date +%s)
            "$W" -m "$M/ggml-small-q5_1.bin" -f s.wav -l ko -mc 0 -bs 1 "$@" > /dev/null 2> err.txt || echo "실패 $?"
            echo "== $(( $(date +%s) - s ))초 | $*"
            grep -E 'vad|VAD' err.txt | grep -iE 'time|speech|segment|reduc' | tail -4 || true
            grep -E '(encode|decode|total) time' err.txt | tr -s ' ' || true
          }
          V="--vad -vm $M/ggml-silero-v6.2.0.bin"
          run -ng -t 3
          run -ng -t 2
          run -ng -t 1
          run -ng -t 3 $V
          run -ng -t 2 $V
          run -ng -t 1 $V
          run -dev 0 -t 3 $V
          run -dev 0 -t 1 $V
